<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>MGLabs</title>

  <meta
    name="description"
    content="MGLabs is a student-built AI, coding, learning, project, productivity, and creative platform."
  />

  <meta property="og:title" content="MGLabs" />

  <meta
    property="og:description"
    content="Learn, build, code, create, organize, and grow with MGLabs."
  />

  <meta property="og:type" content="website" />

  <meta
    name="theme-color"
    content="#071017"
  />

  <script>
    (function () {
      var redirect = sessionStorage.getItem("mglabs_redirect");

      if (redirect) {
        sessionStorage.removeItem("mglabs_redirect");

        if (
          redirect !==
          location.pathname + location.search + location.hash
        ) {
          history.replaceState(null, "", redirect);
        }
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <script
    type="module"
    src="/main.tsx"
  ></script>
</body>
</html>
