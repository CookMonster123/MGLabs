<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifePath Offline</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#0a0b12;color:#f7f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#7c3aed33,transparent 35%),radial-gradient(circle at 10% 80%,#10b98122,transparent 35%),#0a0b12;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:28px 16px 60px}.hero{padding:26px;border:1px solid #ffffff18;border-radius:26px;background:#11131ccc;backdrop-filter:blur(12px)}.hero small,.event small,.card>small{color:#b9a3ff;font-weight:900;letter-spacing:.12em}.hero h1{font-size:52px;margin:8px 0}.hero p{color:#aab0bd;line-height:1.6}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#8b5cf6,#10b981);display:grid;place-items:center;font-size:28px;font-weight:1000}.who{display:flex;gap:12px;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.card,.event{background:#12151f;border:1px solid #ffffff14;border-radius:16px;padding:14px}.stat span{display:block;color:#858c9a;font-size:10px}.stat b{display:block;margin:5px 0}.stat progress{width:100%;accent-color:#8b5cf6}.event{margin-top:12px;padding:20px}.event h2{margin:7px 0}.event p,.card p{color:#aab0bd}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button,.actions button{border:1px solid #ffffff14;background:#191d29;color:#fff;padding:13px;border-radius:12px;text-align:left;cursor:pointer}.choices button:hover{border-color:#8b5cf6}.choices b,.choices span{display:block}.choices span{color:#9298a6;font-size:12px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.log p{font-size:12px;margin:6px 0}.actions{display:flex;gap:8px;margin-top:12px}.actions button{background:linear-gradient(135deg,#8b5cf6,#10b981);font-weight:900}.actions button+button{background:#191d29}@media(max-width:640px){.stats,.grid,.choices{grid-template-columns:1fr}.hero h1{font-size:42px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><section class="hero"><small>MGLABS ORIGINAL · OFFLINE EDITION</small><h1>LifePath</h1><p>A choice-driven life simulator. Grow up, study, work, build relationships, manage money, and see where your choices take you.</p></section><section id="app"></section></main><script>
const N=['Avery','Jordan','Kai','Riley','Maya','Noah','Zoe','Eli','Nina','Theo'];const C=['Student','Retail Associate','Junior Developer','Teacher','Designer','Paramedic','Engineer','Chef','Entrepreneur'];const clamp=n=>Math.max(0,Math.min(100,n));const cash=n=>'$'+Math.round(n).toLocaleString();function fresh(){let name=N[Math.floor(Math.random()*N.length)];return{name,age:0,alive:true,education:'Not started',career:'Child',relationship:'Single',stats:{health:82,happiness:78,smarts:55,social:55,money:0,energy:85},log:[name+' was born. A brand-new story begins.'],achievements:[],year:1}}let state;try{state=JSON.parse(localStorage.getItem('lifepath-offline'))||fresh()}catch(e){state=fresh()}function m(p,line,other={}){let n=JSON.parse(JSON.stringify(state));for(let k in p)n.stats[k]=k==='money'?Math.max(0,n.stats[k]+p[k]):clamp(n.stats[k]+p[k]);Object.assign(n,other);n.log.unshift(line);n.log=n.log.slice(0,12);return n}function ev(){let a=state.age;if(a<6)return['A tiny adventure','You spot a cardboard box and decide it might be a rocket ship.',[['Build the rocket','Smarts +3 · Happiness +8',()=>m({happiness:8,smarts:3},'You built a cardboard rocket.')],['Invite someone to play','Social +8 · Happiness +5',()=>m({social:8,happiness:5},'You turned the box into a two-person spaceship.')]]];if(a<13)return['School choice','Your class announces a project fair.',[['Go all in','Smarts +10 · Energy -8',()=>m({smarts:10,energy:-8},'You worked hard on the school project.')],['Team up','Social +7 · Smarts +6',()=>m({social:7,smarts:6},'You teamed up with classmates.')]]];if(a<18)return['After-school opportunity','You have room for one big commitment this year.',[['Join a club','Social +8 · Smarts +6',()=>m({social:8,smarts:6,energy:-5},'You joined a club.')],['Get a part-time job','Money +900',()=>m({money:900,energy:-8},'You started a part-time job.')],['Focus on grades','Smarts +12',()=>m({smarts:12,happiness:-3},'You focused hard on grades.')]]];if(a===18)return['What comes next?','You finished high school. Pick your next direction.',[['College','Education path',()=>m({smarts:8,money:-1200},'You enrolled in college.',{education:'College'})],['Trade program','Practical path',()=>m({smarts:5,money:-500},'You enrolled in a trade program.',{education:'Trade Program'})],['Start working','Immediate income',()=>m({money:2200},'You entered the workforce.',{education:'High School',career:'Retail Associate'})]]];if(a<30)return['Early adulthood','A new opportunity could shape the next few years.',[['Push your career','Money +4200 · Energy -12',()=>m({money:4200,energy:-12},'You pushed harder at work.',{career:state.career==='Child'||state.career==='Student'?'Junior Developer':state.career})],['Build friendships','Social +10 · Happiness +8',()=>m({social:10,happiness:8,money:-300},'You made time for friends.')],['Start dating','Relationship chance',()=>m({social:6,happiness:6,money:-250},'You started seeing someone.',{relationship:'Dating'})],['Learn a skill','Smarts +9',()=>m({smarts:9,energy:-8,money:-200},'You learned a new skill.')]]];if(a<45)return['Mid-career crossroads','A major opportunity lands in your lap.',[['Take the promotion','Money +8500',()=>m({money:8500,energy:-13},'You accepted a promotion.',{career:C[2+Math.floor(Math.random()*6)]})],['Protect your balance','Health +6 · Happiness +7',()=>m({health:6,happiness:7,energy:8},'You protected your work-life balance.')],['Launch a side project','Risk / reward',()=>m({money:Math.random()>.45?9000:-1200,smarts:5,energy:-10},'You launched a side project.')]]];if(a<65)return['A change of pace','You are thinking more about what makes life meaningful.',[['Mentor someone','Happiness +9',()=>m({happiness:9,social:8},'You started mentoring someone.')],['Travel','Happiness +11 · Money -1800',()=>m({happiness:11,money:-1800,health:2},'You took a memorable trip.')],['Save aggressively','Money +7000',()=>m({money:7000,happiness:-3},'You built a stronger financial cushion.')]]];return['Legacy years','You have more freedom to decide how to spend your time.',[['Family time','Happiness +10',()=>m({happiness:10,social:8,health:2},'You made family time a priority.')],['Volunteer','Social +10',()=>m({happiness:8,social:10,energy:-4},'You volunteered in your community.')],['Take it easy','Health +7 · Energy +10',()=>m({health:7,energy:10},'You slowed down and recharged.')]]]}function age(n){n.age++;n.year++;if(n.age>=6&&n.age<18)n.education=n.age<14?'Elementary / Middle School':'High School';if(n.age>=18&&n.career==='Child')n.career='Student';if(n.age>22&&n.education==='College'&&n.career==='Student'){n.education='College Graduate';n.career='Junior Developer';n.stats.money+=3500}if(n.career!=='Child'&&n.career!=='Student')n.stats.money+=n.age<65?2200:900;n.stats.health=clamp(n.stats.health-(n.age>55?2:n.age>35?1:0));if(n.age>82&&Math.random()<Math.max(.05,(n.age-78)*.025)){n.alive=false;n.log.unshift(n.name+' passed away at age '+n.age+'.')}return n}function award(n){if(n.age>=18&&!n.achievements.includes('Adulting 101'))n.achievements.push('Adulting 101');if(n.stats.money>=10000&&!n.achievements.includes('Five Figures'))n.achievements.push('Five Figures');if(n.stats.smarts>=85&&!n.achievements.includes('Brainpower'))n.achievements.push('Brainpower');if(n.age>=65&&!n.achievements.includes('Long Story'))n.achievements.push('Long Story');return n}function save(n){state=award(n);localStorage.setItem('lifepath-offline',JSON.stringify(state));render()}function pick(i){let e=ev();save(age(e[2][i][2]()))}function render(){let e=ev(),score=Math.round((state.stats.health+state.stats.happiness+state.stats.smarts+state.stats.social)/4+Math.min(30,state.stats.money/2500));document.querySelector('#app').innerHTML=`<div class="top" style="margin-top:14px"><div class="who"><div class="avatar">${state.name[0]}</div><div><b style="font-size:26px">${state.name}</b><div style="color:#9aa0ac">Age ${state.age} · ${state.career} · ${state.education}</div></div></div><div><small>LIFE SCORE</small><b style="display:block;font-size:30px">${score}</b></div></div><div class="stats">${Object.entries(state.stats).map(([k,v])=>`<div class="stat"><span>${k.toUpperCase()}</span><b>${k==='money'?cash(v):v}</b>${k==='money'?'':`<progress max="100" value="${v}"></progress>`}</div>`).join('')}</div>${state.alive?`<div class="event"><small>YEAR ${state.year} · AGE ${state.age}</small><h2>${e[0]}</h2><p>${e[1]}</p><div class="choices">${e[2].map((c,i)=>`<button onclick="pick(${i})"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('')}</div></div>`:`<div class="event"><small>STORY COMPLETE</small><h2>${state.name}'s life</h2><p>You reached age ${state.age}. Final life score: ${score}.</p></div>`}<div class="grid"><div class="card"><small>ACHIEVEMENTS</small>${state.achievements.length?state.achievements.map(x=>`<p>★ ${x}</p>`).join(''):'<p>No achievements yet.</p>'}</div><div class="card log"><small>LIFE LOG</small>${state.log.slice(0,6).map(x=>`<p>${x}</p>`).join('')}</div></div><div class="actions"><button onclick="state=fresh();save(state)">New Life</button><button onclick="localStorage.removeItem('lifepath-offline');state=fresh();save(state)">Reset Save</button></div>`}render();
</script></body></html>
